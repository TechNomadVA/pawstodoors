# Paws2Doors — Cloudflare Pages + D1
# See: https://developers.cloudflare.com/pages/framework-guides/nextjs/
# Create D1 DB: npx wrangler d1 create paws2doors
# Then set database_id below and run: npx wrangler d1 execute paws2doors --file=./d1/migrations/001_initial.sql

name = "paws2doors"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Pages project (used when deploying with wrangler pages deploy)
pages_build_output_dir = ".vercel/output/static"

# D1 database binding (replace database_id with your actual ID from: wrangler d1 list)
[[d1_databases]]
binding = "DB"
database_name = "paws2doors"
database_id = "YOUR_D1_DATABASE_ID"

# Optional: R2 bucket for dog photos/videos (create with: wrangler r2 bucket create paws2doors-media)
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "paws2doors-media"
